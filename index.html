<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CluckSys</title>
  <link rel="stylesheet" href="style/index-desing.css" />
  <link rel="icon" type="image/png" sizes="96x96" href="asset/android-icon-96x96.png" />
</head>

<body>
  <main>
    <div id="preloader" class="preloader">
      <div>
        <img class="preloader__img" src="asset/logo.png" alt="logo CluckSys">
      </div>
      <div class="loader">
        <div class="bar1"></div>
        <div class="bar2"></div>
        <div class="bar3"></div>
        <div class="bar4"></div>
        <div class="bar5"></div>
        <div class="bar6"></div>
        <div class="bar7"></div>
        <div class="bar8"></div>
        <div class="bar9"></div>
        <div class="bar10"></div>
        <div class="bar11"></div>
        <div class="bar12"></div>
      </div>
    </div>
    <div id="contenido" class="mostrar ocultar">
      <div>
        <img class="contenido__img" src="asset/logo.png" alt="logo CluckSys">
      </div>
      <button onclick="goToPage()">
        <div class="svg-wrapper-1">
          <div class="svg-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"> <path fill="none" d="M0 0h24v24H0z"></path><path fill="currentColor" d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"></path></svg>
          </div>
        </div>
        <span>Go in!</span>
      </button>
    </div>
  </main>
  <footer>

  </footer>
  <script src="app.js/app.js"></script>
</body>

</html>
